---

- name: Check if Homebrew is installed in {{ homebrew_prefix }}/bin/brew
  stat:
    path: "{{ homebrew_prefix }}/bin/brew"
  register: homebrew_check

# See roles/base-image/tasks/main.yml: Homebrew's installer refuses to run on
# x86_64 since 2026-09-04, so pin Intel to the last commit before that.
- name: Installing Homebrew
  shell: NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/{{ 'f4aa1b1ca5b256954dbde0315455fb259cdfc45a' if ansible_architecture == 'x86_64' else 'HEAD' }}/install.sh)"
  when:
    - not homebrew_check.stat.exists

- name: Add {{ homebrew_prefix }}/bin to the default system path
  copy:
    dest: "/private/etc/paths.d/homebrew"
    content: |
      {{ homebrew_prefix }}/bin
  become: yes
  when: homebrew_check.stat.exists

- name: Installing Homebrew Packages
  homebrew:
    name:
      - opam
      - pkg-config
    state: present
  register: result
  until: result is successful
  when:
    - not homebrew_check.stat.exists

- name: Updating Homebrew
  homebrew:
    update_homebrew: true
  when: homebrew_check.stat.exists

- name: Upgrading Homebrew Packages
  homebrew:
    upgrade_all: true
  register: result
  until: result is successful
  when: homebrew_check.stat.exists

